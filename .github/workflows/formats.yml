name: formats

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "26"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "^1.4"

      - name: Setup Application
        run: bun install --frozen-lockfile

      - name: Lint Code
        run: bun run lint

      - name: Build Code
        run: bun run build

      - name: Format Code
        run: bun run format

      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "fix code style [skip ci]"
          commit_options: "--no-verify"
